  <script>
    (() => {
      const labels = ['Product', 'Marketing', 'Security'];
      const removedTabs = new Set(['Verdict Feed', 'Ship Log']);
      const addReservedTabs = () => {
        document.querySelectorAll('nav, .lg\\:hidden').forEach((nav) => {
          Array.from(nav.querySelectorAll('button')).forEach((button) => {
            if (removedTabs.has(button.textContent.trim())) button.remove();
          });
          const buttons = Array.from(nav.querySelectorAll('button'));
          const firstFlowButton = buttons.find((button) => button.textContent.trim() === 'My Agents') || buttons.find((button) => button.textContent.trim() === 'Find Work');
          if (!firstFlowButton || nav.querySelector('[data-ziki-reserved="Product"]')) return;

          labels.forEach((label) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.zikiReserved = label;
            button.className = firstFlowButton.className;
            button.textContent = label;
            button.addEventListener('click', () => {
              const toast = document.createElement('div');
              toast.className = 'fixed left-1/2 -translate-x-1/2 bottom-5 z-50 bg-blue-500 text-white px-4 py-3 rounded-full shadow-xl text-sm font-bold';
              toast.textContent = `${label} is reserved for a future flow.`;
              document.body.appendChild(toast);
              window.setTimeout(() => toast.remove(), 2200);
            });
            firstFlowButton.before(button);
          });
        });
        document.querySelectorAll('button').forEach((button) => {
          if (['Open Verdict Feed', 'Open Ship Log'].includes(button.textContent.trim())) button.remove();
        });
      };

      addReservedTabs();
      new MutationObserver(addReservedTabs).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <script>
    (() => {
      const arrangeOperatorView = () => {
        const main = document.querySelector('main');
        if (!main) return;
        const sections = Array.from(main.children);
        const needs = sections.find((el) => (el.textContent || '').includes('NEEDS YOU NOW · AT FIRST GLANCE'));
        const agents = sections.find((el) => (el.textContent || '').includes('AGENT UPDATES · FIRST PERSON'));
        const riskSummary = sections.find((el) => (el.textContent || '').startsWith('2 risks open:'));
        main.style.display = 'flex';
        main.style.flexDirection = 'column';
        if (agents) agents.style.order = '2';
        if (needs) needs.style.order = '3';
        const work = sections.find((el) => (el.textContent || '').includes('YOUR WORK · OPERATOR VIEW'));
        if (work) work.style.order = '4';
        if (riskSummary) { riskSummary.style.display = 'none'; riskSummary.style.order = '5'; }
        const header = sections.find((el) => (el.textContent || '').includes('Good afternoon') || (el.textContent || '').includes('Good morning') || (el.textContent || '').includes('Good evening'));
        if (header) header.style.order = '1';
        const footer = sections.find((el) => el.tagName === 'FOOTER');
        if (footer) footer.style.order = '6';
        const needLabel = Array.from(main.querySelectorAll('*')).find((el) => el.children.length === 0 && el.textContent.trim() === 'NEED YOU NOW');
        const needCard = needLabel && needLabel.parentElement;
        const summaryWrap = needCard && needCard.parentElement;
        const greetingRow = summaryWrap && summaryWrap.parentElement;
        if (needCard && summaryWrap && greetingRow && greetingRow !== main) {
          greetingRow.classList.add('ziki-greeting-row');
          if (needCard.parentElement === summaryWrap) { greetingRow.appendChild(needCard); summaryWrap.style.display = 'none'; }
        }
        const risksLabel = Array.from(main.querySelectorAll('*')).find((el) => el.children.length === 0 && el.textContent.trim() === 'RISKS OPEN');
        if (risksLabel && risksLabel.parentElement) risksLabel.parentElement.style.display = 'none';

        document.querySelectorAll('button').forEach((button) => {
          if ((button.textContent || '').includes('Simulate upvotes')) { button.style.display = 'none'; button.setAttribute('aria-hidden', 'true'); }
        });
        document.querySelectorAll('*').forEach((el) => {
          if (el.children.length === 0 && el.textContent.trim() === 'Issue owner · Zedu') { el.style.display = 'none'; el.setAttribute('aria-hidden', 'true'); }
        });

        ['NEED YOU NOW', 'RISKS OPEN'].forEach((label) => {
          const text = Array.from(main.querySelectorAll('*')).find((el) => el.children.length === 0 && el.textContent.trim() === label);
          const card = text && text.parentElement;
          if (!card || card.dataset.zikiActionCard) return;
          card.dataset.zikiActionCard = 'true';
          card.classList.add('ziki-summary-card');
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
